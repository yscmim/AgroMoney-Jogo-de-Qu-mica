name: Publicar AgroMoney no GitHub Pages

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências (Flet)
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar Flet para Web
        run: |
          # Substitua 'main.py' pelo nome do seu arquivo Python principal se for diferente
          flet build web main.py

      - name: Implantar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
